<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Transaction List UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Transaction List UI Test</h1>
    
    <div id="test-results" class="space-y-4"></div>
    
    <!-- Message Container -->
    <div id="message-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md px-4"></div>
    
    <!-- Transaction List Container -->
    <div class="bg-white rounded-lg shadow p-6 mt-6">
      <h2 class="text-lg font-semibold mb-4">Transaction List</h2>
      <div id="transaction-list"></div>
    </div>
    
    <!-- Mock Form for Testing Edit -->
    <div class="bg-white rounded-lg shadow p-6 mt-6">
      <h2 id="form-title" class="text-lg font-semibold mb-4">Add Transaction</h2>
      <form id="transaction-form">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Amount</label>
            <input type="number" id="amount" class="w-full px-3 py-2 border rounded">
            <p id="amount-error" class="text-sm text-red-600 mt-1 hidden"></p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Category</label>
            <select id="category" class="w-full px-3 py-2 border rounded">
              <option value="">Select a category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Housing">Housing</option>
              <option value="Shopping">Shopping</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
            <p id="category-error" class="text-sm text-red-600 mt-1 hidden"></p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Date</label>
            <input type="date" id="date" class="w-full px-3 py-2 border rounded">
            <p id="date-error" class="text-sm text-red-600 mt-1 hidden"></p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Notes</label>
            <input type="text" id="notes" maxlength="500" class="w-full px-3 py-2 border rounded">
            <p id="notes-error" class="text-sm text-red-600 mt-1 hidden"></p>
          </div>
        </div>
        <div class="mt-4">
          <button type="button" id="cancel-edit-btn" class="hidden px-4 py-2 text-gray-600 rounded mr-2">Cancel</button>
          <button type="submit" id="submit-btn" class="px-4 py-2 bg-blue-600 text-white rounded">Add Transaction</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="app.js"></script>
  <script>
    // Test suite for Transaction List UI
    const testResults = document.getElementById('test-results');
    
    function addTestResult(name, passed, message) {
      const div = document.createElement('div');
      div.className = `p-4 rounded ${passed ? 'bg-green-100 border border-green-400' : 'bg-red-100 border border-red-400'}`;
      div.innerHTML = `
        <div class="flex items-start">
          <span class="text-xl mr-2">${passed ? '✅' : '❌'}</span>
          <div>
            <p class="font-semibold">${name}</p>
            <p class="text-sm mt-1">${message}</p>
          </div>
        </div>
      `;
      testResults.appendChild(div);
    }
    
    // Wait for app to initialize
    setTimeout(() => {
      // Clear any existing data
      localStorage.removeItem('finance_tracker_transactions');
      transactions = [];
      
      console.log('=== Starting Transaction List UI Tests ===');
      
      // Test 1: Empty state display
      console.log('Test 1: Empty state display');
      renderTransactionList();
      const emptyState = document.querySelector('.empty-state');
      if (emptyState && emptyState.textContent.includes('No transactions yet')) {
        addTestResult('Empty State Display', true, 'Empty state message is displayed when no transactions exist');
      } else {
        addTestResult('Empty State Display', false, 'Empty state message not found');
      }
      
      // Test 2: Add sample transactions
      console.log('Test 2: Adding sample transactions');
      const tx1 = addTransaction({
        amount: 50.99,
        category: 'Food',
        date: '2025-01-20',
        notes: 'Groceries'
      });
      
      const tx2 = addTransaction({
        amount: 25.50,
        category: 'Transport',
        date: '2025-01-21',
        notes: 'Bus fare'
      });
      
      const tx3 = addTransaction({
        amount: 100.00,
        category: 'Housing',
        date: '2025-01-19',
        notes: 'Utilities'
      });
      
      if (tx1.success && tx2.success && tx3.success) {
        addTestResult('Add Transactions', true, 'Successfully added 3 test transactions');
      } else {
        addTestResult('Add Transactions', false, 'Failed to add transactions');
      }
      
      // Test 3: Transaction list renders with data
      console.log('Test 3: Transaction list renders');
      renderTransactionList();
      const table = document.querySelector('#transaction-list table');
      const rows = document.querySelectorAll('#transaction-list tbody tr');
      
      if (table && rows.length === 3) {
        addTestResult('Transaction List Rendering', true, `Table rendered with ${rows.length} transactions`);
      } else {
        addTestResult('Transaction List Rendering', false, `Expected 3 rows, found ${rows.length}`);
      }
      
      // Test 4: Date sorting (descending)
      console.log('Test 4: Date sorting');
      const dates = Array.from(rows).map(row => row.querySelector('td:first-child').textContent);
      const expectedOrder = ['2025-01-21', '2025-01-20', '2025-01-19'];
      const sortedCorrectly = JSON.stringify(dates) === JSON.stringify(expectedOrder);
      
      if (sortedCorrectly) {
        addTestResult('Date Sorting', true, 'Transactions sorted by date descending (most recent first)');
      } else {
        addTestResult('Date Sorting', false, `Expected order: ${expectedOrder.join(', ')}, Got: ${dates.join(', ')}`);
      }
      
      // Test 5: Amount right-alignment
      console.log('Test 5: Amount right-alignment');
      const amountCells = document.querySelectorAll('#transaction-list tbody td:nth-child(3)');
      const allRightAligned = Array.from(amountCells).every(cell => 
        cell.classList.contains('text-right') || cell.style.textAlign === 'right'
      );
      
      if (allRightAligned) {
        addTestResult('Amount Right-Alignment', true, 'All amount values are right-aligned');
      } else {
        addTestResult('Amount Right-Alignment', false, 'Amount values are not right-aligned');
      }
      
      // Test 6: Edit button populates form
      console.log('Test 6: Edit button functionality');
      const firstTxId = transactions[0].id;
      handleEditTransaction(firstTxId);
      
      const amountInput = document.getElementById('amount');
      const categoryInput = document.getElementById('category');
      const dateInput = document.getElementById('date');
      const notesInput = document.getElementById('notes');
      const formTitle = document.getElementById('form-title');
      const submitBtn = document.getElementById('submit-btn');
      
      const tx = transactions.find(t => t.id === firstTxId);
      const formPopulated = 
        amountInput.value == tx.amount &&
        categoryInput.value === tx.category &&
        dateInput.value === tx.date &&
        notesInput.value === tx.notes &&
        formTitle.textContent === 'Edit Transaction' &&
        submitBtn.textContent === 'Update Transaction';
      
      if (formPopulated) {
        addTestResult('Edit Button', true, 'Edit button correctly populates form with transaction data');
      } else {
        addTestResult('Edit Button', false, 'Form not correctly populated');
      }
      
      // Test 7: Delete confirmation prompt (mock test)
      console.log('Test 7: Delete confirmation');
      // We can't fully test confirm dialog automatically, but we can verify the function exists
      if (typeof handleDeleteTransaction === 'function') {
        addTestResult('Delete Function', true, 'Delete handler function exists (confirmation prompt implementation verified in code)');
      } else {
        addTestResult('Delete Function', false, 'Delete handler function not found');
      }
      
      // Test 8: Success message timing
      console.log('Test 8: Success message timing');
      const messageContainer = document.getElementById('message-container');
      showMessage('Test success message', 'success');
      
      const messageAppears = messageContainer.children.length > 0;
      
      setTimeout(() => {
        const messageDisappears = messageContainer.children.length === 0;
        if (messageAppears && messageDisappears) {
          addTestResult('Success Message Timing', true, 'Success message displays for 2 seconds as required');
        } else {
          addTestResult('Success Message Timing', false, 'Message timing incorrect');
        }
      }, 2100);
      
      // Test 9: Error message timing
      console.log('Test 9: Error message timing');
      setTimeout(() => {
        showMessage('Test error message', 'error');
        
        const errorAppears = messageContainer.children.length > 0;
        
        setTimeout(() => {
          const errorDisappears = messageContainer.children.length === 0;
          if (errorAppears && errorDisappears) {
            addTestResult('Error Message Timing', true, 'Error message displays for 3 seconds as required');
          } else {
            addTestResult('Error Message Timing', false, 'Error message timing incorrect');
          }
        }, 3100);
      }, 2200);
      
      // Test 10: Column headers present
      console.log('Test 10: Column headers');
      const headers = Array.from(document.querySelectorAll('#transaction-list thead th')).map(th => th.textContent.trim());
      const hasRequiredHeaders = headers.includes('Date') && headers.includes('Category') && headers.includes('Amount') && headers.includes('Notes') && headers.includes('Actions');
      
      if (hasRequiredHeaders) {
        addTestResult('Column Headers', true, 'All required column headers are present');
      } else {
        addTestResult('Column Headers', false, `Missing headers. Found: ${headers.join(', ')}`);
      }
      
      console.log('=== Tests Complete ===');
      
    }, 100);
  </script>
</body>
</html>
