<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Dashboard Functions</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body>
  <h1>Dashboard Function Tests</h1>
  <div id="test-results"></div>
  
  <script>
    // Load the constants and functions from app.js
    const CATEGORIES = ['Food', 'Transport', 'Housing', 'Shopping', 'Entertainment', 'Health', 'Other'];
    let transactions = [];
    
    // Copy calculation functions from app.js
    function getTotalSpending() {
      const total = transactions.reduce((sum, tx) => {
        const amount = parseFloat(tx.amount);
        return sum + amount;
      }, 0);
      return Math.round(total * 100) / 100;
    }
    
    function getSpendingByCategory() {
      const categoryTotals = {};
      const total = getTotalSpending();
      
      CATEGORIES.forEach(cat => {
        categoryTotals[cat] = 0;
      });
      
      transactions.forEach(tx => {
        const amount = parseFloat(tx.amount);
        if (categoryTotals.hasOwnProperty(tx.category)) {
          categoryTotals[tx.category] += amount;
        }
      });
      
      const result = Object.entries(categoryTotals)
        .filter(([category, amount]) => amount > 0)
        .map(([category, amount]) => ({
          category,
          amount: Math.round(amount * 100) / 100,
          percentage: total > 0 ? Math.round((amount / total) * 10000) / 100 : 0
        }));
      
      return result;
    }
    
    function getSpendingByMonth() {
      const monthlyTotals = {};
      const now = new Date();
      
      for (let i = 11; i >= 0; i--) {
        const date = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        monthlyTotals[key] = 0;
      }
      
      transactions.forEach(tx => {
        const date = new Date(tx.date);
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        
        if (monthlyTotals.hasOwnProperty(key)) {
          const amount = parseFloat(tx.amount);
          monthlyTotals[key] += amount;
        }
      });
      
      const result = Object.entries(monthlyTotals).map(([month, amount]) => ({
        month,
        amount: Math.round(amount * 100) / 100
      }));
      
      return result;
    }
    
    // Test data
    const testTransactions = [
      { id: '1', amount: 50.99, category: 'Food', date: '2025-01-15', notes: 'Groceries' },
      { id: '2', amount: 25.50, category: 'Transport', date: '2025-01-16', notes: 'Bus fare' },
      { id: '3', amount: 100.00, category: 'Food', date: '2025-01-20', notes: 'Restaurant' },
      { id: '4', amount: 15.75, category: 'Entertainment', date: '2024-12-25', notes: 'Movie' },
      { id: '5', amount: 200.00, category: 'Housing', date: '2025-01-01', notes: 'Rent' }
    ];
    
    // Run tests
    const results = [];
    
    // Test 1: Empty transactions
    transactions = [];
    const emptyTotal = getTotalSpending();
    results.push(`Test 1 - Empty transactions: Total = ${emptyTotal} (expected 0)`);
    results.push(`   Result: ${emptyTotal === 0 ? 'PASS' : 'FAIL'}`);
    
    // Test 2: Total spending calculation
    transactions = testTransactions;
    const total = getTotalSpending();
    const expectedTotal = 392.24; // 50.99 + 25.50 + 100.00 + 15.75 + 200.00
    results.push(`Test 2 - Total spending: ${total} (expected ${expectedTotal})`);
    results.push(`   Result: ${total === expectedTotal ? 'PASS' : 'FAIL'}`);
    
    // Test 3: Spending by category
    const categoryData = getSpendingByCategory();
    results.push(`Test 3 - Spending by category:`);
    categoryData.forEach(cat => {
      results.push(`   ${cat.category}: $${cat.amount.toFixed(2)} (${cat.percentage.toFixed(1)}%)`);
    });
    
    const foodCat = categoryData.find(c => c.category === 'Food');
    results.push(`   Food total check: ${foodCat.amount} (expected 150.99)`);
    results.push(`   Result: ${foodCat.amount === 150.99 ? 'PASS' : 'FAIL'}`);
    
    // Test 4: Spending by month
    const monthlyData = getSpendingByMonth();
    results.push(`Test 4 - Spending by month (last 12 months):`);
    results.push(`   Total months: ${monthlyData.length} (expected 12)`);
    results.push(`   Result: ${monthlyData.length === 12 ? 'PASS' : 'FAIL'}`);
    
    // Test 5: Single category (Requirement 3.8)
    transactions = [
      { id: '1', amount: 100.00, category: 'Food', date: '2025-01-15', notes: 'Test' }
    ];
    const singleCat = getSpendingByCategory();
    results.push(`Test 5 - Single category:`);
    results.push(`   Categories: ${singleCat.length} (expected 1)`);
    results.push(`   Percentage: ${singleCat[0].percentage}% (expected 100)`);
    results.push(`   Result: ${singleCat.length === 1 && singleCat[0].percentage === 100 ? 'PASS' : 'FAIL'}`);
    
    // Test 6: Zero/negative amounts (Requirement 3.9)
    transactions = [
      { id: '1', amount: 100.00, category: 'Food', date: '2025-01-15', notes: 'Test' },
      { id: '2', amount: 0, category: 'Transport', date: '2025-01-16', notes: 'Zero' },
      { id: '3', amount: -10.00, category: 'Food', date: '2025-01-17', notes: 'Refund' }
    ];
    const totalWithZeroNeg = getTotalSpending();
    results.push(`Test 6 - Zero and negative amounts:`);
    results.push(`   Total: ${totalWithZeroNeg} (expected 90.00)`);
    results.push(`   Result: ${totalWithZeroNeg === 90 ? 'PASS' : 'FAIL'}`);
    
    // Test 7: Currency formatting (Requirement 6.9)
    transactions = [{ id: '1', amount: 10.5, category: 'Food', date: '2025-01-15', notes: 'Test' }];
    const formatted = getTotalSpending();
    results.push(`Test 7 - Currency formatting (2 decimal places):`);
    results.push(`   Total: ${formatted.toFixed(2)} (expected 10.50)`);
    results.push(`   Result: ${formatted.toFixed(2) === '10.50' ? 'PASS' : 'FAIL'}`);
    
    // Display results
    document.getElementById('test-results').innerHTML = '<pre>' + results.join('\n') + '</pre>';
  </script>
</body>
</html>
